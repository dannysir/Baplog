services:
  postgres:
    image: postgres:16
    container_name: baplog-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: baplog
    ports:
      - "5432:5432"
    volumes:
      - baplog_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d baplog"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  baplog_pg_data:
